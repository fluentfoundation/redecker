<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14424E"/>
      <stop offset="1" stop-color="#0C2B34"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C05A"/>
      <stop offset="1" stop-color="#D99A33"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9985C"/>
      <stop offset="0.5" stop-color="#C08347"/>
      <stop offset="1" stop-color="#9C662F"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- subtle floor line -->
    <path d="M 0 418 H 512" stroke="#0A222A" stroke-width="8" opacity="0.55"/>

    <!-- sweep motion arcs trailing behind the broom -->
    <g fill="none" stroke="#7FD1C9" stroke-linecap="round">
      <path d="M 96 396 A 210 210 0 0 1 138 268" stroke-width="16" opacity="0.9"/>
      <path d="M 138 408 A 150 150 0 0 1 168 312" stroke-width="13" opacity="0.6"/>
      <path d="M 178 414 A 100 100 0 0 1 198 348" stroke-width="10" opacity="0.35"/>
    </g>

    <!-- old SemVer tags being swept away -->
    <g font-family="'DejaVu Sans Mono', monospace" font-weight="bold" text-anchor="middle">
      <!-- v1.0.0 — biggest, closest to the broom -->
      <g transform="translate(148 232) rotate(-18)">
        <rect x="-58" y="-24" width="116" height="48" rx="12" fill="#E9F4F2"/>
        <circle cx="-42" cy="0" r="7" fill="#0C2B34"/>
        <text x="10" y="9" font-size="26" fill="#123B47">v1.0.0</text>
      </g>
      <!-- v1.0.1 — tumbling further out -->
      <g transform="translate(92 150) rotate(16)" opacity="0.8">
        <rect x="-50" y="-20" width="100" height="40" rx="10" fill="#BFE0DB"/>
        <circle cx="-36" cy="0" r="6" fill="#0C2B34"/>
        <text x="8" y="8" font-size="22" fill="#123B47">v1.0.1</text>
      </g>
      <!-- v0.9.2 — smallest, nearly gone -->
      <g transform="translate(52 232) rotate(-32)" opacity="0.55">
        <rect x="-42" y="-17" width="84" height="34" rx="9" fill="#8FBDB7"/>
        <circle cx="-30" cy="0" r="5" fill="#0C2B34"/>
        <text x="7" y="7" font-size="18" fill="#0C2B34">v0.9.2</text>
      </g>
    </g>
    <!-- a little residual dust -->
    <g fill="#7FD1C9">
      <circle cx="182" cy="188" r="5" opacity="0.5"/>
      <circle cx="128" cy="290" r="4" opacity="0.4"/>
    </g>

    <!-- broom, tilted mid-sweep -->
    <g transform="translate(300 250) rotate(34)">
      <!-- handle -->
      <rect x="-13" y="-235" width="26" height="240" rx="13" fill="url(#wood)"/>
      <!-- hang loop hint -->
      <circle cx="0" cy="-224" r="4.5" fill="#7A4E22"/>

      <!-- straw head -->
      <path d="M -26 2
               C -52 34 -70 88 -76 148
               L -60 152 -44 146 -28 153 -12 147 4 154 20 147 36 153 52 147 66 151
               C 62 88 48 34 26 2
               Z" fill="url(#straw)"/>

      <!-- bristle strands -->
      <g stroke="#B27A22" stroke-width="5" stroke-linecap="round" opacity="0.8">
        <path d="M -34 44 C -46 78 -56 112 -61 142"/>
        <path d="M -12 40 C -18 76 -24 112 -27 144"/>
        <path d="M 10 40 C 10 76 9 112 8 145"/>
        <path d="M 30 44 C 38 78 46 112 51 142"/>
      </g>

      <!-- Redecker-red stitching bands -->
      <path d="M -33 26 C -12 38 12 38 33 26" fill="none" stroke="#C63C3C" stroke-width="12" stroke-linecap="round"/>
      <path d="M -44 58 C -16 72 16 72 44 58" fill="none" stroke="#C63C3C" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

      <!-- highlight on straw -->
      <path d="M -20 14 C -30 50 -37 96 -41 136" stroke="#F7D98C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>
  </g>
</svg>
