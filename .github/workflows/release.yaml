name: Release

# This is the workflow registered with nuget.org Trusted Publishing.
#
# IMPORTANT: the trusted publishing policy identifies this workflow by FILE NAME only
# ("release.yaml"), not by path. Renaming this file breaks publishing until the policy is
# updated to match, so treat the name as part of the published contract.
#
# Publishing is keyless: the job requests a short-lived OIDC token from GitHub, nuget.org
# validates it against the policy, and returns an API key valid for one hour. There is no
# long-lived secret to rotate or leak.

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack, but do not push to nuget.org'
        type: boolean
        default: true

# Least privilege at the top; the publish job widens only what it needs.
permissions:
  contents: read

env:
  solution: 'Redecker.slnx'
  buildConfiguration: Release

jobs:
  release:
    name: Pack & Publish
    runs-on: ubuntu-latest

    # Gates publishing behind a GitHub environment, so protection rules (required reviewers,
    # branch restrictions) apply. The name must match the Environment field of the nuget.org
    # policy. If you leave that field blank, delete this line too, or the token exchange fails.
    environment: release

    permissions:
      id-token: write   # required: lets the job request the OIDC token nuget.org validates
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # GitVersion needs full history and tags to compute a version.
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: 6.3.x

    - name: Execute GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
      with:
        updateAssemblyInfo: false

    # An empty version would otherwise be discovered as MSB4044 during the build, or worse,
    # produce a package named after nothing. GitVersion 6 removed the v5 `nuGetVersionV2`
    # output; guard against that class of mistake rather than the one instance of it.
    - name: Verify GitVersion produced a version
      shell: bash
      run: |
        if [ -z "${{ steps.gitversion.outputs.semVer }}" ]; then
          echo "::error::GitVersion produced an empty semVer. Compare the output name against" \
               "the variables listed in the Execute GitVersion step log."
          exit 1
        fi
        echo "Version: ${{ steps.gitversion.outputs.semVer }}"

    - name: Setup dotnet SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore & Build
      run: >
        dotnet build ${{ env.solution }}
        --configuration ${{ env.buildConfiguration }}
        -p:Version=${{ steps.gitversion.outputs.semVer }}
        -p:ContinuousIntegrationBuild=true

    # Never publish something that was not tested, including the checks that read real
    # packages off nuget.org.
    - name: Test
      run: >
        dotnet test ${{ env.solution }}
        --configuration ${{ env.buildConfiguration }}
        --no-build
        --verbosity quiet

    - name: Pack
      run: >
        dotnet pack ${{ env.solution }}
        --configuration ${{ env.buildConfiguration }}
        --no-build
        -p:Version=${{ steps.gitversion.outputs.semVer }}

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: nupkg-${{ steps.gitversion.outputs.semVer }}
        path: artifacts/packages/*
        retention-days: 14

    - name: Summarise
      shell: bash
      run: |
        {
          echo "### Redecker ${{ steps.gitversion.outputs.semVer }}"
          echo
          echo '| Package | Size |'
          echo '| --- | ---: |'
          for f in artifacts/packages/*.nupkg artifacts/packages/*.snupkg; do
            [ -e "$f" ] || continue
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    # Checked before the login rather than after, so a missing value is named for what it is
    # instead of surfacing as the action's "Input required and not supplied: user". Prints
    # nothing but the outcome, since the value may be held as a secret.
    - name: Verify the nuget.org username is configured
      if: github.event_name == 'push' || !inputs.dry-run
      shell: bash
      run: |
        if [ -z "${{ secrets.NUGET_USER || vars.NUGET_USER }}" ]; then
          echo "::error::NUGET_USER is not set on the 'release' environment. Add it under" \
               "Settings > Environments > release, as either a secret or a variable, set to" \
               "the nuget.org profile name of whoever created the trusted publishing policy."
          exit 1
        fi
        echo "NUGET_USER is configured."

    # The API key lives for one hour, so this must come immediately before the push rather
    # than at the top of the job.
    - name: NuGet login (OIDC to short-lived API key)
      id: login
      if: github.event_name == 'push' || !inputs.dry-run
      uses: NuGet/login@v1
      with:
        # The nuget.org profile name of the person who CREATED the policy -- not the policy
        # name, and not the organization that owns it. NuGet/login sends this as `username`
        # in the token-exchange body and fails with "Make sure you are using the username of
        # the policy creator, not the policy owner" when it is wrong.
        #
        # Accepts it as either an environment secret or a variable. GitHub presents the two
        # side by side under Settings > Environments, and picking the other one silently
        # yields an empty string rather than an error -- which cost one failed release with
        # the unhelpful "Input required and not supplied: user".
        user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

    - name: NuGet push
      if: github.event_name == 'push' || !inputs.dry-run
      run: >
        dotnet nuget push "artifacts/packages/*.nupkg"
        --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
