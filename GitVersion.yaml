# Mirrors FluentMigrator's conventions so the two repositories version the same way.
# tag-prefix accepts both `v1.2.3` and `1.2.3`; the release workflow triggers on `v*`.
assembly-versioning-scheme: Major
assembly-file-versioning-format: MajorMinorPatch
tag-prefix: '[vV]?'
branches:
  release:
    mode: ContinuousDeployment
  hotfix:
    mode: ContinuousDeployment
ignore:
  sha: []
